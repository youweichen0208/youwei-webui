name: Hermes workbench
on:
  push:
    branches: [develop]
    paths: ['backend/open_webui/utils/hermes*.py', 'backend/open_webui/routers/hermes.py', 'backend/open_webui/routers/openai.py', 'backend/tests/hermes/**', 'src/lib/apis/hermes/**', 'src/lib/components/chat/hermes/**', 'src/lib/components/chat/Messages/**', 'src/lib/components/agent/**', 'src/routes/(app)/agent/**', 'src/routes/(app)/calendar/**', '.github/workflows/hermes-workbench.yml']
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  native-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: pip install -r backend/tests/hermes/requirements.txt
      - name: Install fixed native Hermes for offline fixtures
        run: |
          git init /tmp/hermes-chat-native
          git -C /tmp/hermes-chat-native remote add origin https://github.com/NousResearch/hermes-agent
          git -C /tmp/hermes-chat-native fetch --depth 1 origin f97608f178d1ffeca59860195ab7da295f7c8e5f
          git -C /tmp/hermes-chat-native checkout FETCH_HEAD
          uv sync --project /tmp/hermes-chat-native --frozen --no-dev --extra messaging --python 3.13
      - run: python ops/verify_hermes_chat.py /tmp/hermes-chat-native
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/tests/hermes/requirements.txt
      - run: PYTHONPATH=backend python -m pytest -q backend/tests/hermes
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit
      - run: npx svelte-kit sync
      - run: npx vitest run src/lib/apis/hermes/index.test.ts src/lib/apis/startup.test.ts
      - run: npx vitest run --config vitest.sidebar.config.ts
      - run: npx vitest run --config vitest.hermes-chat.config.ts
      - run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          npm_package_version: '0.11.4'
