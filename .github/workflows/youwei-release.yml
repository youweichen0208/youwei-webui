name: Youwei image
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish the selected revision as an immutable candidate (does not deploy)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: youwei-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed source revision
        run: |
          docker build --build-arg BUILD_HASH="$GITHUB_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "ghcr.io/youweichen0208/youwei-webui:$GITHUB_SHA" .
      - name: Publish immutable source tag
        if: (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/develop' || inputs.publish_candidate))
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/youweichen0208/youwei-webui:$GITHUB_SHA"
